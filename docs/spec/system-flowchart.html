<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowchart ระบบเสขาประจำวัน</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans Thai', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Sans Thai', serif;
      --font-mono:     'Geist Mono', 'Noto Sans Thai', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>เส้นทางการทำงานของเสขาประจำวัน</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-flowchart-title system-flowchart-desc">
        <title id="system-flowchart-title">Flowchart ระบบเสขาประจำวัน</title>
        <desc id="system-flowchart-desc">Flowchart แสดงการเปิดแอป ตรวจ session เข้าสู่หน้า Portal เลือกฟีเจอร์ เรียก Supabase ผ่านชั้น Hook และ Service และการตรวจสิทธิ์ RLS ที่นำไปสู่การแสดงผลหรือข้อผิดพลาดที่ลองใหม่ได้</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <g fill="none" stroke="#4f5d75" stroke-width="1.2">
          <line x1="160" y1="88" x2="160" y2="140" marker-end="url(#arrow)"/>
          <line x1="160" y1="228" x2="160" y2="300" marker-end="url(#arrow)"/>
          <line x1="240" y1="184" x2="340" y2="184" marker-end="url(#arrow)"/>
          <path d="M248,332 H392 Q400,332 400,324 V216" marker-end="url(#arrow)"/>
          <line x1="540" y1="184" x2="620" y2="184" marker-end="url(#arrow)"/>
          <line x1="700" y1="216" x2="700" y2="300" marker-end="url(#arrow)"/>
          <line x1="700" y1="364" x2="700" y2="420" stroke="#2e5aa8" marker-end="url(#arrow-link)"/>
          <line x1="608" y1="468" x2="500" y2="468" stroke="#bf4520" marker-end="url(#arrow-accent)"/>
          <line x1="700" y1="516" x2="700" y2="580" marker-end="url(#arrow)"/>
          <path d="M800,612 H872 Q880,612 880,604 V192 Q880,184 872,184 H780" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        </g>

        <g font-family="'Geist Mono','Noto Sans Thai',ui-monospace,monospace" font-size="9" fill="#4f5d75" text-anchor="middle">
          <rect x="172" y="252" width="44" height="16" rx="2" fill="#f5f5f5"/>
          <text x="194" y="264">ไม่มี</text>
          <rect x="268" y="160" width="44" height="16" rx="2" fill="#f5f5f5"/>
          <text x="290" y="172">มี</text>
          <rect x="296" y="304" width="56" height="16" rx="2" fill="#f5f5f5"/>
          <text x="324" y="316">สำเร็จ</text>
          <rect x="556" y="160" width="56" height="16" rx="2" fill="#f5f5f5"/>
          <text x="584" y="172">เลือกเมนู</text>
          <rect x="712" y="250" width="52" height="16" rx="2" fill="#f5f5f5"/>
          <text x="738" y="262">เรียกใช้</text>
          <rect x="712" y="384" width="52" height="16" rx="2" fill="#f5f5f5"/>
          <text x="738" y="396" fill="#2e5aa8">HTTPS</text>
          <rect x="534" y="444" width="44" height="16" rx="2" fill="#f5f5f5"/>
          <text x="556" y="456" fill="#bf4520">ผ่าน</text>
          <rect x="712" y="540" width="52" height="16" rx="2" fill="#f5f5f5"/>
          <text x="738" y="552">ไม่ผ่าน</text>
          <rect x="888" y="380" width="48" height="16" rx="2" fill="#f5f5f5"/>
          <text x="912" y="392">ลองใหม่</text>
        </g>

        <g font-family="'Geist','Noto Sans Thai',system-ui,sans-serif" text-anchor="middle">
          <rect x="88" y="48" width="144" height="40" rx="20" fill="#f5f5f5"/>
          <rect x="88" y="48" width="144" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="160" y="72" fill="#2d3142" font-size="12" font-weight="600">เปิดแอป</text>

          <polygon points="160,140 240,184 160,228 80,184" fill="#f5f5f5"/>
          <polygon points="160,140 240,184 160,228 80,184" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="160" y="182" fill="#2d3142" font-size="12" font-weight="600">มี session?</text>
          <text x="160" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono',ui-monospace,monospace">AuthProvider</text>

          <rect x="72" y="300" width="176" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="72" y="300" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="160" y="328" fill="#2d3142" font-size="12" font-weight="600">เข้าสู่ระบบ / สมัคร</text>
          <text x="160" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono',ui-monospace,monospace">username + password</text>

          <rect x="340" y="152" width="200" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="340" y="152" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="440" y="180" fill="#2d3142" font-size="12" font-weight="600">หน้า Portal</text>
          <text x="440" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono',ui-monospace,monospace">ภาพรวมวันนี้ + การ์ดฟีเจอร์</text>

          <rect x="620" y="152" width="160" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="620" y="152" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="700" y="180" fill="#2d3142" font-size="12" font-weight="600">หน้าฟีเจอร์</text>
          <text x="700" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono',ui-monospace,monospace">มาจาก Feature Registry</text>

          <rect x="600" y="300" width="200" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="600" y="300" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="700" y="328" fill="#2d3142" font-size="12" font-weight="600">Hook → Service</text>
          <text x="700" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono',ui-monospace,monospace">UI ไม่เรียก Supabase ตรง</text>

          <polygon points="700,420 792,468 700,516 608,468" fill="#f5f5f5"/>
          <polygon points="700,420 792,468 700,516 608,468" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
          <text x="700" y="466" fill="#2d3142" font-size="12" font-weight="600">RLS ผ่าน?</text>
          <text x="700" y="482" fill="#4f5d75" font-size="9" font-family="'Geist Mono',ui-monospace,monospace">auth.uid() = user_id</text>

          <rect x="300" y="448" width="200" height="40" rx="20" fill="#f5f5f5"/>
          <rect x="300" y="448" width="200" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="400" y="472" fill="#2d3142" font-size="12" font-weight="600">แสดงผล + Toast สำเร็จ</text>

          <rect x="600" y="580" width="200" height="64" rx="6" fill="#f5f5f5"/>
          <rect x="600" y="580" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="700" y="608" fill="#2d3142" font-size="12" font-weight="600">แสดง Error + Toast</text>
          <text x="700" y="626" fill="#4f5d75" font-size="9" font-family="'Geist Mono',ui-monospace,monospace">มีปุ่มลองใหม่</text>
        </g>

        <line x1="30" y1="672" x2="930" y2="672" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <g font-family="'Geist Mono','Noto Sans Thai',ui-monospace,monospace" font-size="8" fill="#4f5d75">
          <text x="30" y="696" letter-spacing="0.14em">LEGEND</text>
          <rect x="110" y="686" width="28" height="14" rx="7" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="146" y="696">เริ่ม / จบ</text>
          <rect x="230" y="686" width="28" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="266" y="696">ขั้นตอน</text>
          <polygon points="350,693 364,685 378,693 364,701" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="386" y="696">การตัดสินใจ</text>
          <line x1="490" y1="693" x2="518" y2="693" stroke="#2e5aa8" stroke-width="1.2"/>
          <text x="526" y="696">เรียกผ่านเครือข่าย</text>
          <line x1="650" y1="693" x2="678" y2="693" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
          <text x="686" y="696">ย้อนกลับ</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
